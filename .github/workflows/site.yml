name: Site

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      allow_mass_delete:
        description: 'Permitir a exclusão em massa de arquivos no GitHub (use só depois de conferir o Drive)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: site-${{ github.event_name == 'push' && 'push' || 'sync' }}
  cancel-in-progress: false

jobs:
  sync:
    if: github.event_name != 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Instalar ffmpeg (extrai o áudio dos vídeos)
        run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - run: npm run sync
        timeout-minutes: 315
        env:
          GDRIVE_SA_JSON: ${{ secrets.GDRIVE_SA_JSON }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TIME_BUDGET_MIN: '300'
          ALLOW_MASS_DELETE: ${{ inputs.allow_mass_delete && '1' || '' }}
      - name: Gravar catálogo
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- web/public/catalog.json; then
            echo "Catálogo sem mudanças."
          else
            git config user.name "louvores-bot"
            git config user.email "louvores-bot@users.noreply.github.com"
            git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git add web/public/catalog.json
            git commit -m "chore: atualiza catálogo"
            ok=0
            for i in 1 2 3; do
              if git pull --rebase origin main && git push origin HEAD:main; then ok=1; break; fi
              git rebase --abort || true
              sleep 10
            done
            [ "$ok" = 1 ] || { echo "Falha ao publicar o catálogo"; exit 1; }
          fi

  deploy:
    needs: sync
    if: ${{ !cancelled() }}
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
        env:
          # Endereço secreto da versão completa (bônus liberados). Fica só nos segredos do GitHub.
          FULL_PATH: ${{ secrets.FULL_PATH }}
          # WhatsApp que recebe os comprovantes e instruções de pagamento (variáveis do repositório)
          VITE_WHATSAPP: ${{ vars.WHATSAPP }}
          VITE_PIX_KEY: ${{ vars.PIX_KEY }}
          VITE_PIX_NAME: ${{ vars.PIX_NAME }}
          VITE_PRICES: ${{ vars.PRICES }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
